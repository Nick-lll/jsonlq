name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Test
        run: python -m pytest -q
      - name: Smoke test the CLI
        run: |
          printf '%s\n' '{"id":1,"level":"error","duration_ms":900}' '{"id":2,"level":"info","duration_ms":10}' > /tmp/smoke.jsonl
          jsonlq show /tmp/smoke.jsonl --where level=error | tee /tmp/out.jsonl
          grep -q '"id": 1' /tmp/out.jsonl
          test "$(jsonlq show /tmp/smoke.jsonl --where duration_ms'>'500 --count)" = "1"
          jsonlq stats /tmp/smoke.jsonl duration_ms --json | grep -q '"max": 900'
